version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: final_llm_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: final_llm_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  auth-service:
    build: ./auth_service
    container_name: final_llm_auth
    ports:
      - "8000:8000"
    env_file:
      - ./auth_service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  bot-service:
    build: ./bot_service
    container_name: final_llm_bot
    ports:
      - "8001:8001"
    env_file:
      - ./bot_service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload

  celery-worker:
    build: ./bot_service
    container_name: final_llm_celery
    env_file:
      - ./bot_service/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.infra.celery_app worker --loglevel=info